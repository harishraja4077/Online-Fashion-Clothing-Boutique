<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e9">
  <meta name="description" content="We couldn't find that page. Head back to Stackly and discover something you love.">
  <title>Page Not Found — Stackly Boutique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #181310;
      --ink-soft: #574c43;
      --cream: #f6f1e9;
      --paper: #fffdfa;
      --sand: #ece2d5;
      --accent: #a8452b;
      --line: rgba(24, 19, 16, 0.14);
      font-family: "Jost", sans-serif;
      color: var(--ink);
      background: var(--cream);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(255, 253, 250, 0.9), transparent 58%),
        var(--cream);
    }

    a { color: inherit; }

    .site-header {
      display: flex;
      justify-content: center;
      padding: 28px 24px;
    }

    .logo { display: inline-flex; align-items: center; }
    .logo img { display: block; width: auto; height: 46px; }

    main {
      width: min(100% - 40px, 760px);
      margin: auto;
      padding: 44px 0 84px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      width: 30px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(6rem, 21vw, 13rem);
      font-weight: 400;
      letter-spacing: -0.075em;
      line-height: 0.88;
    }

    h1 span { color: var(--accent); }

    h2 {
      margin: 28px 0 12px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.7rem, 5vw, 2.45rem);
      font-weight: 400;
      line-height: 1.2;
    }

    .message {
      max-width: 430px;
      margin: 0 auto;
      color: var(--ink-soft);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 24px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--cream);
      font: 500 11px/1 "Jost", sans-serif;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
      cursor: pointer;
    }

    .button:hover { transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .button-secondary { background: transparent; color: var(--ink); }
    .button-secondary:hover { background: var(--sand); }
    .button-primary:hover { border-color: var(--accent); background: var(--accent); }
    .button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }

    .decoration {
      position: relative;
      width: 104px;
      height: 1px;
      margin: 30px auto 0;
      background: var(--line);
    }

    .decoration::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border: 1px solid var(--accent);
      background: var(--cream);
      content: "";
      transform: translate(-50%, -50%) rotate(45deg);
    }

    footer {
      padding: 20px;
      color: var(--ink-soft);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-align: center;
    }

    @media (max-width: 480px) {
      .site-header { padding-top: 22px; }
      .logo img { height: 40px; }
      main { padding: 32px 0 58px; }
      .actions { flex-direction: column; align-items: stretch; max-width: 280px; margin-right: auto; margin-left: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Stackly Boutique home">
      <img src="Assets/logo.webp" alt="Stackly Boutique">
    </a>
  </header>

  <main>
    <p class="eyebrow">A little off the path</p>
    <h1 aria-label="Error 404">4<span>0</span>4</h1>
    <h2>This page wandered off.</h2>
    <p class="message">The page you’re looking for may have moved or no longer exists. Let’s get you back to something lovely.</p>
    <div class="actions">
      <button class="button button-secondary" id="goBack" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
        Go Back
      </button>
      <a class="button button-primary" href="index.html">
        Back to Home
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
      </a>
    </div>
    <div class="decoration" aria-hidden="true"></div>
  </main>

  <footer>STACKLY BOUTIQUE &nbsp;·&nbsp; CURATED FOR YOUR EVERYDAY</footer>

  <script>
    document.getElementById("goBack").addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
